# ntrip.yaml — NTRIP client configuration for u-blox F9P RTK corrections
#
# Loaded when NTRIP_ENABLED=true and a hardware receiver or bridge is selected.
# Set host/port/mountpoint here; put credentials in gitignored ntrip_secrets.yaml.
# Copy ntrip_secrets.yaml.template to ntrip_secrets.yaml before enabling NTRIP.
# Requires ros-jazzy-ntrip-client. Set NTRIP_ENABLED=false to disable.
#
ntrip_client_node:
  ros__parameters:
    host: ""           # NTRIP caster hostname or IP, e.g. "ntrip.example.com"
    port: 2101         # NTRIP caster port (standard is 2101)
    mountpoint: ""     # Mountpoint name, e.g. "MOUNTPOINT0"
    authenticate: true
    rtcm_message_package: rtcm_msgs  # Must match ublox_dgnss expectation
