name: Run tests and upload coverage

on:
  push:
    branches: [ caatinga-dev, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt coverage

      - name: Run tests
        run: |
          # Each package's tests expect to run from the package directory,
          # as in `make test`. Every run writes its own data file, then the
          # files are combined into one report.
          run_suite() {
            pkg="$1"; start="$2"
            (cd "src/$pkg" && coverage run \
              --data-file="$GITHUB_WORKSPACE/.coverage.$pkg" \
              --source="$pkg" --omit='*/test_*.py' \
              -m unittest discover -s "$start")
          }
          run_suite devkit_ui test
          run_suite devkit_driver test
          run_suite devkit_mavlink_bridge test
          run_suite devkit_f2c_planner .
          coverage combine --keep
          coverage xml -o coverage.xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Agroecology-Lab/Sowbot
          files: coverage.xml
