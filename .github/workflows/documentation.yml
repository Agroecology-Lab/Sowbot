name: Deploy Sphinx Docs to Sowbot_Data

permissions:
  contents: read

on:
  push:
    branches: [ caatinga-dev ]

jobs:
  build-and-push-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Install Documentation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3-pip python3-sphinx
          pip3 install --break-system-packages breathe sphinx-rtd-theme myst-parser
          # autodoc imports these modules to pull docstrings, so their real
          # (pure-Python) runtime deps must be installed. ROS/hardware-specific
          # deps that can't be installed here are mocked in docs/conf.py instead.
          pip3 install --break-system-packages numpy scipy scikit-image shapely pyquaternion deepdiff PyYAML

      - name: Generate Doxygen XML
        run: doxygen Doxyfile

      - name: Build Sphinx HTML
        run: |
          set -o pipefail
          mkdir -p docs/_build
          sphinx-build --keep-going -b html docs docs/_build/html 2>&1 | tee docs/_build/sphinx.log
          touch docs/_build/html/.nojekyll

      - name: Check every package under src/ is in the docs
        # Fails if a package has no page, or a module failed to import. Without
        # this, --keep-going lets a broken import drop out of the published docs.
        run: python3 docs/check_coverage.py docs/_build/sphinx.log

      - name: Deploy Docs to Sowbot_Data Repo
        # Pinned to the commit `main` pointed at on 2026-10-18 (tag v1.7.3). This step receives DOCS_DEPLOY_TOKEN.
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        with:
          source-directory: 'docs/_build/html'
          destination-github-username: 'Agroecology-Lab'
          destination-repository-name: 'Sowbot_Data'
          target-branch: 'main'
          target-directory: 'docs'
          user-email: 'action@github.com'
          user-name: 'GitHub Action Bot'
