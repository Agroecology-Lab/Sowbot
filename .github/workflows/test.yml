name: Run Tests

on: [push]

permissions:
  contents: read

jobs:
  code-checks:
    strategy:
      matrix:
        tools:
          - name: pylint
            command: >-
              pylint --disable=duplicate-code
              ./src/devkit_driver/devkit_driver
              ./src/devkit_ui/devkit_ui
              ./src/devkit_ui/test/*.py
              ./src/devkit_mavlink_bridge/devkit_mavlink_bridge
              ./src/devkit_f2c_planner/devkit_f2c_planner
              --fail-under=10.0
          - name: ruff
            command: make ruff
          - name: mypy
            command: make mypy
          - name: import-linter
            command: make lint-imports
          - name: test
            command: make test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install dependencies
        run: pip install -r requirements-dev.txt
      - name: ${{ matrix.tools.name }}
        run: ${{ matrix.tools.command }}
